<!DOCTYPE html>
<html lang="sw">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BYAO - Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<style>

body{
    background:#050b18;
    color:white;
    font-family:Segoe UI,Tahoma,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.card{

    width:90%;
    max-width:400px;
    background:#0f172a;
    border:1px solid #00e5ff40;
    border-radius:20px;
    padding:25px;
    box-shadow:0 0 30px #00e5ff20;

}


h2{
    color:#00e5ff;
    text-align:center;
}


input{

    width:100%;
    padding:14px;
    margin-top:15px;
    background:#020617;
    border:1px solid #334155;
    border-radius:12px;
    color:white;
    box-sizing:border-box;

}


button{

    width:100%;
    margin-top:20px;
    padding:14px;
    background:#0066ff;
    border:none;
    border-radius:12px;
    color:white;
    font-weight:bold;

}


#message{

margin-top:15px;
text-align:center;
font-size:13px;

}


</style>

</head>


<body>


<div class="card">

<h2>
BYAO Admin Password Reset
</h2>


<p>
Weka password mpya ya Master Admin
</p>


<input 
type="password"
id="newPassword"
placeholder="Password mpya">


<button onclick="updatePassword()">
Hifadhi Password Mpya
</button>


<div id="message"></div>


</div>



<script>

window.supabaseClient.auth.onAuthStateChange(
async (event, session)=>{

console.log("AUTH EVENT:", event);


if(event === "PASSWORD_RECOVERY"){

console.log("Recovery session tayari");


window.recoveryReady = true;

}


});



async function updatePassword(){


const password =
document.getElementById("newPassword").value.trim();


const msg =
document.getElementById("message");



if(password.length < 6){

msg.innerHTML =
"❌ Password iwe na angalau herufi 6";

return;

}



if(!window.recoveryReady){

msg.innerHTML =
"❌ Recovery session haijapatikana. Fungua link tena.";

return;

}



const {
error
}= await window.supabaseClient.auth.updateUser({

password: password

});



if(error){

msg.innerHTML =
"❌ Error: "+error.message;

return;

}



msg.innerHTML =
"✅ Password imebadilishwa vizuri.";


setTimeout(()=>{

window.location.href="index.html";

},3000);


}


</script>


</body>
</html>
