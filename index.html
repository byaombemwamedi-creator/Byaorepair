  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#030712',
            accentCyan: '#00e5ff',
            accentBlue: '#0066ff'
          },
          animation: {
            'move-right-left': 'moveRightLeft 18s ease-in-out infinite alternate',
            'move-left-right': 'moveLeftRight 22s ease-in-out infinite alternate',
            'move-top-bottom': 'moveTopBottom 15s ease-in-out infinite alternate',
            'move-bottom-top': 'moveBottomTop 19s ease-in-out infinite alternate',
            'pulse-shrink': 'pulseShrink 4s ease-in-out infinite',
            'explode-glow': 'explodeGlow 5s ease-in-out infinite',
            'float-diagonal': 'floatDiagonal 20s linear infinite alternate'
          },
          keyframes: {
            moveRightLeft: {
              '0%': { transform: 'translateX(-30vw) rotate(0deg) scale(0.9)' },
              '50%': { transform: 'translateX(35vw) rotate(180deg) scale(1.15)' },
              '100%': { transform: 'translateX(-30vw) rotate(360deg) scale(0.9)' }
            },
            moveLeftRight: {
              '0%': { transform: 'translateX(40vw) rotate(0deg) scale(1.1)' },
              '50%': { transform: 'translateX(-25vw) rotate(-180deg) scale(0.85)' },
              '100%': { transform: 'translateX(40vw) rotate(-360deg) scale(1.1)' }
            },
            moveTopBottom: {
              '0%': { transform: 'translateY(-30vh) scale(1)' },
              '50%': { transform: 'translateY(40vh) scale(1.3)' },
              '100%': { transform: 'translateY(-30vh) scale(1)' }
            },
            moveBottomTop: {
              '0%': { transform: 'translateY(35vh) scale(0.8)' },
              '50%': { transform: 'translateY(-35vh) scale(1.2)' },
              '100%': { transform: 'translateY(35vh) scale(0.8)' }
            },
            pulseShrink: {
              '0%, 100%': { transform: 'scale(1)', opacity: '0.8' },
              '50%': { transform: 'scale(0.4)', opacity: '0.2' }
            },
            explodeGlow: {
              '0%, 100%': { transform: 'scale(0.8)', filter: 'drop-shadow(0 0 5px rgba(0,229,255,0.2))', opacity: '0.6' },
              '50%': { transform: 'scale(1.4)', filter: 'drop-shadow(0 0 35px rgba(0,229,255,0.9))', opacity: '1' }
            },
            floatDiagonal: {
              '0%': { transform: 'translate(-20vw, -20vh) rotate(0deg)' },
              '100%': { transform: 'translate(30vw, 30vh) rotate(360deg)' }
            }
          }
        }
      }
    }
  </script>

  <!-- Script ya Logic, Supabase & Router -->
  <script>
async function handleLogin(event){

event.preventDefault();


const emailInput = document.getElementById("userEmail");
const passwordInput = document.getElementById("userPassword");


if(!emailInput || !passwordInput){

console.error("Email au Password input haipo");

return;

}


const email = emailInput.value.trim();
const password = passwordInput.value.trim();



const errorBanner =
document.getElementById("errorCodeBanner");

const errorMsg =
document.getElementById("errorMsgText");



try{


const {data, error} =
await supabaseClient.auth.signInWithPassword({

email: email,

password: password

});



if(error){

console.error(error);


if(errorMsg){

errorMsg.innerText =
"Login imekataa: " + error.message;

}


if(errorBanner){

errorBanner.classList.remove("hidden");

}


return;

}




const user = data.user;



if(!user){

throw new Error("User hajapatikana");

}




// Chukua profile yake

const {data:profile, error:profileError}
=
await supabaseClient

.from("profiles")

.select("*")

.eq("id", user.id)

.single();



if(profileError){

console.error(profileError);

throw new Error("Profile haijapatikana");

}





// Angalia kama account active

if(profile.is_active === false){

throw new Error(
"Account hii imefungwa na Admin"
);

}




// Hifadhi session

saveToCache(
"byao_user_session",
profile
);




// Badilisha UI

document.getElementById("loginForm")
?.classList.add("hidden");


document.getElementById("verificationState")
?.classList.remove("hidden");



const welcome =
document.getElementById("welcomeText");


if(welcome){

welcome.innerText =
"Karibu, " + profile.full_name;

}




// Routing

setTimeout(()=>{


switch(profile.role){


case "admin":

window.location.href="admin.html";

break;


case "fundi":

case "technician":

window.location.href="fundi.html";

break;



case "mteja":

case "client":

window.location.href="mteja.html";

break;



case "mfanyabiashara":

window.location.href="mfanyabiashara.html";

break;



default:

window.location.href="index.html";


}



},2000);



}

catch(err){


console.error(err);


if(errorMsg){

errorMsg.innerText =
err.message;

}


if(errorBanner){

errorBanner.classList.remove("hidden");

}
}

}
 document.addEventListener("DOMContentLoaded", function(){

const savedLang =
localStorage.getItem('byao_selected_lang') || 'sw';


const langSelector =
document.getElementById('languageSelector');


if(langSelector){
    langSelector.value = savedLang;
}


if(typeof applyTranslations === "function"){
    applyTranslations(savedLang);
}


});

</script>
